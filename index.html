<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="color-scheme" content="dark">
<title>Bolatau Apps</title>
<meta name="description" content="Apps by Bolatau, with their privacy policies and support pages.">
<style>
:root {
  --ink: #f4f1e8;
  --body: rgba(244, 241, 232, 0.9);
  --line: rgba(244, 241, 232, 0.38);
  --matte-top: rgba(255, 255, 255, 0.13);
  --matte-mid: rgba(255, 255, 255, 0.025);
  --matte-low: rgba(0, 0, 0, 0.12);
  --floor: #050507;
}
@media (prefers-contrast: more) {
  :root { --matte-top: rgba(255, 255, 255, 0.08); --matte-low: rgba(0, 0, 0, 0.25); --body: var(--ink); --line: rgba(244, 241, 232, 0.7); }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--floor);
  color: var(--ink);
  font: 18px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
/* The whole window is the display: a 48 x 48 field that the GPU scales, under matte glass and grain. */
.field, .layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* Stretched to the window like the app's field, so the pools stay large and soft. */
.field { object-fit: fill; background: linear-gradient(150deg, #7b22d6, #ab2588 45%, #3a3ae0); }
.depth { background: rgba(0, 0, 0, 0.1); }
.matte { background: linear-gradient(146deg, var(--matte-top) 0%, var(--matte-mid) 46%, var(--matte-low) 100%); }
.grain { opacity: 0.075; background-size: 192px 192px; }
/* Glass light: a soft sheen from the top left and a gentle fall-off at the edges. Static, so it costs nothing per frame. */
.sheen { background: radial-gradient(120% 90% at 15% -10%, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0) 60%), radial-gradient(140% 120% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.2) 100%); }
/* Large and then small, centred just above the middle, as on the "You're in" screen. */
main {
  position: relative;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  min-height: 92vh; min-height: 92svh;
  max-width: 640px; margin: 0 auto;
  padding: max(48px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left));
  text-align: center;
}
h1, h2 { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; letter-spacing: -0.026em; }
h1 { font-size: clamp(3rem, 11vw, 4.1rem); line-height: 1.02; }
.lede { margin: 12px 0 0; color: var(--body); font-size: 1.11rem; }
.apps { margin: 56px 0 0; padding: 0; list-style: none; display: grid; gap: 34px; }
h2 { font-size: 1.5rem; line-height: 1.2; }
.links { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 26px; }
a {
  display: inline-flex; align-items: center; min-height: 44px;
  color: var(--body); font-size: 1rem; text-decoration: underline; text-decoration-color: var(--line);
  text-decoration-thickness: 1px; text-underline-offset: 5px;
  transition: color 180ms ease, text-decoration-color 180ms ease;
}
a:hover { color: var(--ink); text-decoration-color: var(--ink); }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
footer { position: relative; padding: 0 20px max(24px, env(safe-area-inset-bottom)); text-align: center; }
footer a { font-size: 0.9rem; }
/* Each line arrives once: a fade and a small rise, the app's ease-out. */
.arrive { opacity: 0; transform: translateY(var(--rise, 6px)); animation: arrive var(--time, 900ms) cubic-bezier(0.16, 1, 0.3, 1) var(--delay, 0ms) forwards; }
@keyframes arrive { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .arrive { opacity: 1; transform: none; animation: none; }
  a { transition: none; }
}
/* As in the app, reduced transparency removes the grain texture but keeps the field, depth and matte.
   A 3% grain stays: about one 8-bit step, so the gradient does not band. */
@media (prefers-reduced-transparency: reduce) {
  .sheen { display: none; }
  .grain { opacity: 0.03; }
}
@media (forced-colors: active) {
  .field, .layer { display: none; }
}
</style>
</head>
<body>
<canvas class="field" width="48" height="48" aria-hidden="true"></canvas>
<div class="layer depth" aria-hidden="true"></div>
<div class="layer matte" aria-hidden="true"></div>
<div class="layer sheen" aria-hidden="true"></div>
<div class="layer grain" aria-hidden="true"></div>
<main>
<h1 class="arrive" style="--rise: 10px; --time: 1100ms; --delay: 150ms">Apps.</h1>
<p class="lede arrive" style="--delay: 550ms">Privacy, support and technical pages.</p>
<ul class="apps">
<li class="arrive" style="--delay: 850ms">
<h2>PhonicEther</h2>
<ul class="links">
<li><a href="phonicether/privacy/">Privacy Policy</a></li>
<li><a href="phonicether/support/">Support</a></li>
<li><a href="phonicether/encryption/">Encryption</a></li>
</ul>
</li>
<li class="arrive" style="--delay: 1050ms">
<h2>Nowte</h2>
<ul class="links">
<li><a href="https://bolatau.github.io/nowte_privacy_policy">Privacy Policy</a></li>
</ul>
</li>
</ul>
</main>
<footer class="arrive" style="--delay: 1250ms"><a href="https://github.com/Bolatau">GitHub</a></footer>
